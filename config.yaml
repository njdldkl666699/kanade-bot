# yaml-language-server: $schema=./schemas/MergedConfig.json
environment: prod
log_level: INFO

driver: ~fastapi
host: 127.0.0.1
port: 39210

command_start: ["/"]
command_sep: [" "]

nickname: ["宵崎奏"]

superusers: ["user"]

console_strict_tome: true

localstore_use_cwd: true

render:
  provider: playwright
  startup: probe
  provider_config:
    engine: chromium
    connect_ws:
      endpoint: ws://127.0.0.1:39211/
    skip_browser_install: true
    storage_path: ~/.cache/ms-playwright
    remote_local_resource_policy: memory
  html:
    max_pixels: 2147483647
    max_auto_height: 2147483647
  resources:
    local_access:
      allowed_paths:
        - config

chat:
  agent:
    model: deepseek-flash
  session:
    buffer_max_size: 256
  compaction:
    trigger_fraction: 0.7
    keep_pairs: 3
    min_clear_tokens: 2000
    summary_target_fraction: 0.8
    summary_model: null
    summary_keep_messages: 20
    summary_keep_user_messages: true
    summary_prompt_file: CompactionSummary.md
    online_valve_fraction: 0.92
  memory:
    max_records_per_scope: 256
  scheduled_task:
    retry_limit: 2
    retry_delay_minutes: 5
  sandbox:
    enabled: false
  sticker_meme:
    enabled: false
    topk: 5
    min_similarity: 0.3
    softmax_scale: 55.0
  # image_caption:
  #   system_prompt_file: ImageCaption.md
  rag:
    enabled: false
    query_n_results: 3
    distance_threshold: 0.65
    document_file: kanade_wiki.json
  auto_reply:
    enabled: false
    gate:
      system_prompt_file: ReplyGate.md
    time_windows: []
    daily_reset_time: "04:00"
    backoff_start: 3
    backoff_base: 30
    backoff_cap: 600
    gate_timeout: 30
  configs_file: chat_configs.json
  fail_image_file: chat_fail.jpg

crystal:
  config_file: crystal_config.json

gacha:
  config_file: gacha_config.json
  show_trained: true

harvest:
  config_file: harvest_config.json
  result_template_file: harvest_result_template.html
  results_template_file: harvest_results_template.html
  daily_power: 10
  power_crystal_cost: 10

fun:
  ciallo_image_file: 宵崎奏Ciallo.webp
  plus_one_threshold: 4
  duanzi_list_file: duanzi.json

gallery:
  send_pic_limit: 10
  send_pic_as_meme: true

help:
  welcome_image_file: welcome.gif

music:
  playlist_file: lx_list
  playlist_link: "https://blog.njdldkl666699.dpdns.org/playlists/"
  audio_page_size: 10
  lyric_default_length: 4

summary:
  model: deepseek-flash
  system_prompt_file: Summarizer.md
  bot_name: 宵崎奏
  min_size: 10
  max_size: 2048

tool:
  fallback_icon_file: grass_block.png
  template_file: mcstatus_template.html
  preset_reaction_config_file: preset_reaction_config.json
  image_provider: agnes
  agnes_base_url: https://api.agnes-ai.cn/v1

wordle:
  default_length: 5
  default_dictionary: CET4
  min_length: 3
  max_length: 13
  meanings: ["中释"]

mindle:
  max_attempts: 10
  crystal_bonus: 25
  hinted_crystal_bonus: 10
  background_image: background.png
  lang_file: zh_cn.json
  render_items_dir: items/
  recipes_dir: recipe/

handle:
  strict_mode: true
  color_enhance: false
  crystal_bonus: 25
  hinted_crystal_bonus: 15
  answer_file: answers.json
  idiom_file: words.txt

ps_command: ["状态", "status"]
ps_reply_target: false
ps_ignore_parts: ["snap"]
ps_test_sites:
  - name: "百度"
    url: "https://www.baidu.com"

github_type: 0
whateat_cd: 0
wordcloud_background_color: white

generate_schemas: false
schema_output_dir: ./schemas

print_kanade_banner: true
print_pydantic_ai_banner: true

watchdog:
  github_repo: njdldkl666699/kanade-bot
  github_branch: main
  poll_interval: 30
  user_agent: "kanade-watchdog"
  core_command: "uv sync && nb run"
  core_exit_timeout: 180
