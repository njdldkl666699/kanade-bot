# yaml-language-server: $schema=./schemas/MergedConfig.json
superusers:
  - "user"
log_level: DEBUG
nickname: [宵崎奏]

# 是否启用无头模式，如果为true，则不会启动TUI界面。
console_headless_mode: true

# Provider配置（OpenAI兼容端点）
siliconflow:
  base_url: &siliconflow-base_url https://api.siliconflow.cn/v1
  api_key: &siliconflow-api_key sk-xxxxxxxxxxxxxxxxxxxxx
agnes-ai: &agnes-ai
  base_url: https://api.agnes-ai.cn/v1
  api_key: &agnes-ai-api_key sk-xxxxxxxxxxxxxxxxxxxxx
sensenova: &sensenova
  base_url: https://token.sensenova.cn/v1/
  api_key: &sensenova-api_key sk-xxxxxxxxxxxxxxxxxxxxx
deepseek: &deepseek
  base_url: https://api.deepseek.com
  api_key: sk-xxxxxxxxxxxxxxxxxxxxx

# 模型配置
deepseek-official: &deepseek-official
  model: deepseek-chat
  provider: *deepseek
  max_output_tokens: 8192

sensenova-6-8-flash-lite: &sensenova-6-8-flash-lite
  model: sensenova-6.8-flash-lite
  provider: *sensenova
  reasoning_effort: high
  vision: true
  max_output_tokens: 65536

chat:
  agent:
    <<: *deepseek-official
    mcp_servers:
      tavily:
        url: https://mcp.tavily.com/mcp
        headers:
          Authorization: "Bearer tvly-dev-xxxxxxxxxxxxxxxxxxxxx"
      anysearch:
        url: https://api.anysearch.com/mcp
  # 会话压缩（比例均相对当前模型的上下文窗口）
  compaction:
    trigger_fraction: 0.8 # 上下文占用超过此比例才触发
    keep_pairs: 3 # 保留最近几个工具调用对
    min_clear_tokens: 2000 # 清理收益太小就跳过，保护缓存
    # summary_target_fraction: 0.9  # 设了才启用 LLM 摘要档（默认不启用）
    # summary_model: null            # 摘要模型，null = 继承主模型
    # summary_keep_messages: 40      # 生成摘要时保留的最近消息条数
  # 会话历史存储（消息缓冲区 + 数据库）
  session:
    db_file: agent_sessions.sqlite3
    buffer_max_size: 256
    buffer_cache_file: session_messages_cache.json
  # 持久化记忆
  memory:
    database_file: memories.sqlite3
    max_records_per_scope: 256
  # 文件能力与shell由Landlock沙箱提供（TTL/LRU自动回收，见sandbox段）
  sandbox:
    enabled: true
    # 沙箱环境变量（对工作区内所有进程可见，勿存放敏感密钥）
    environment:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    memory_limit: 256M # 受限子进程内存上限
    max_concurrent_sandboxes: 4 # 同时存活的最大沙箱数
    idle_timeout_minutes: 30 # 空闲回收阈值
    sweeper_interval_minutes: 5 # 后台回收扫描间隔
    workspace_dir: sandboxes/ # 工作区根目录名（插件缓存目录）
  # 图片转述模型（主模型不支持视觉时用于图片兑底）
  # image_caption:
  #   <<: *sensenova-6-8-flash-lite
  rag:
    embedding_type: openai
    openai_base_url: *siliconflow-base_url
    openai_api_key: *siliconflow-api_key
    openai_model: BAAI/bge-m3

fun:
  lolicon_proxy: example.com

help:
  online_notice_group_ids: [1145141919]
  ntfy_topic_url: https://ntfy.sh/your_personal_topic
  ntfy_message: |
    你的Bot账号: {self_id} 掉线了，去重新登录吧。
    `Message`: {message}

summary:
  <<: *deepseek-official

tool:
  sensenova_api_key: *sensenova-api_key
  agnes_api_key: *agnes-ai-api_key

wordle:
  crystal_bonus_map:
    3: 5
    4: 7
    5: 10
    6: 15
    7: 20
    8: 25
    9: 30
    10: 35
    11: 40
    12: 45
    13: 50
  hinted_crystal_bonus_map:
    3: 2
    4: 3
    5: 5
    6: 7
    7: 10
    8: 12
    9: 15
    10: 17
    11: 20
    12: 22
    13: 25

watchdog:
  github_token: github_pat_xxxxxxxxxxxxxxxxxxxxxxx

generate_schemas: false
