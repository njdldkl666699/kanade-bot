# yaml-language-server: $schema=./schemas/MergedConfig.json
superusers:
  - "user"
log_level: DEBUG
nickname: [宵崎奏]

# 是否启用无头模式，如果为true，则不会启动TUI界面。
console_headless_mode: true

# Provider配置
openrouter:
  type: openai
  base_url: https://openrouter.ai/api/v1
  api_key: sk-or-v1-xxxxxxxxxxxxxxxxxxxxx
opencode:
  type: openai
  base_url: https://opencode.ai/zen/v1/
  api_key: sk-xxxxxxxxxxxxxxxxxxxxx
siliconflow:
  type: openai
  base_url: &siliconflow-base_url https://api.siliconflow.cn/v1
  api_key: &siliconflow-api_key sk-xxxxxxxxxxxxxxxxxxxxx
agnes-ai: &agnes-ai
  type: openai
  base_url: https://api.agnes-ai.cn/v1
  api_key: &agnes-ai-api_key sk-xxxxxxxxxxxxxxxxxxxxx
sensenova: &sensenova
  type: openai
  base_url: https://token.sensenova.cn/v1/
  api_key: &sensenova-api_key sk-xxxxxxxxxxxxxxxxxxxxx

# 模型配置
agnes-3.0-flash: &agnes-3-0-flash
  model: agnes-3.0-flash
  provider: *agnes-ai
  reasoning_effort: high
  model_capabilities:
    supports:
      vision: true
      reasoning_effort: true
    limits:
      max_context_window_tokens: 524288
      max_output_tokens: 65536

sensenova-deepseek-v4-flash: &sensenova-deepseek-v4-flash
  model: deepseek-v4-flash
  provider: *sensenova
  reasoning_effort: high
  model_capabilities:
    supports:
      vision: false
      reasoning_effort: true
    limits:
      max_context_window_tokens: 1048576
      max_output_tokens: 65536

sensenova-6.8-flash-lite: &sensenova-6-8-flash-lite
  model: sensenova-6.8-flash-lite
  provider: *sensenova
  reasoning_effort: high
  model_capabilities:
    supports:
      vision: true
      reasoning_effort: true
    limits:
      max_context_window_tokens: 262144
      max_output_tokens: 65536

ccp-deepseek-v4-flash: &ccp-deepseek-v4-flash
  model: deepseek-v4-flash
  provider:
    type: openai
    base_url: http://localhost:39211/v1
  reasoning_effort: high
  model_capabilities:
    supports:
      vision: false
      reasoning_effort: true
    limits:
      max_context_window_tokens: 1048576
      max_output_tokens: 65536

chat:
  <<: *ccp-deepseek-v4-flash
  mcp_servers:
    tavily:
      type: http
      tools: ["*"]
      url: https://mcp.tavily.com/mcp
      headers:
        Authorization: "Bearer tvly-dev-xxxxxxxxxxxxxxxxxxxxx"
    anysearch:
      type: http
      tools: ["*"]
      url: https://api.anysearch.com/mcp
  excluded_tools:
    - bash
    - list_bash
    - read_bash
    - stop_bash
    - write_bash
    - apply_patch
    - create
    - edit
    - view
    - list_agents
    - read_agent
    - task
    - write_agent
    - ask_user
    - glob
    - grep
    - skill
  image_caption:
    <<: *sensenova-6-8-flash-lite
  rag:
    embedding_type: openai
    openai_base_url: *siliconflow-base_url
    openai_api_key: *siliconflow-api_key
    openai_model: BAAI/bge-m3

fun:
  lolicon_proxy: example.com

help:
  online_notice_group_ids: [1145141919]
  ntfy_topic_url: https://ntfy.sh/your_personal_topic
  ntfy_message: |
    你的Bot账号: {self_id} 掉线了，去重新登录吧。
    `Message`: {message}

summary:
  <<: *sensenova-deepseek-v4-flash

tool:
  sensenova_api_key: *sensenova-api_key
  agnes_api_key: *agnes-ai-api_key

wordle:
  crystal_bonus_map:
    3: 5
    4: 7
    5: 10
    6: 15
    7: 20
    8: 25
    9: 30
    10: 35
    11: 40
    12: 45
    13: 50
  hinted_crystal_bonus_map:
    3: 2
    4: 3
    5: 5
    6: 7
    7: 10
    8: 12
    9: 15
    10: 17
    11: 20
    12: 22
    13: 25

watchdog:
  github_token: github_pat_xxxxxxxxxxxxxxxxxxxxxxx

generate_schemas: false
