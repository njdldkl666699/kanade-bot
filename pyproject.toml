[project]
name = "kanade-bot"
version = "v6.0.1"
description = "kanade-bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "anyconfig>=0.15.1",
  "chardet>=5.2",
  "chinesecalendar>=1.11.0",
  "emoji>=2.15.0",
  "httpx>=0.28.1",
  "mcstatus>=13.0.1",
  "mirage-ai @ git+https://gh-proxy.org/https://github.com/strukto-ai/mirage.git@main#subdirectory=python",
  "nonebot-adapter-console>=0.9.0",
  "nonebot-adapter-onebot @ git+https://gh-proxy.org/https://github.com/njdldkl666699/kanade-bot-adapter-onebot.git@master",
  "nonebot-plugin-apscheduler>=0.5.0",
  "nonebot-plugin-chatrecorder @ git+https://gh-proxy.org/https://github.com/njdldkl666699/nonebot-plugin-chatrecorder.git@main",
  "nonebot-plugin-datastore>=1.3.1",
  "nonebot-plugin-githubcard>=0.4.1",
  "nonebot-plugin-htmlrender @ git+https://gh-proxy.org/https://github.com/njdldkl666699/nonebot-plugin-htmlrender.git@backport/pr-112",
  "nonebot-plugin-localstore>=0.7.4",
  "nonebot-plugin-orm[default]>=0.8.3",
  "nonebot-plugin-picstatus>=2.3.0",
  "nonebot-plugin-whateat-pic>=1.5.9",
  "nonebot-plugin-wordcloud>=0.10.0",
  "nonebot2[fastapi]>=2.5.0",
  "picimagesearch>=3.12.11",
  "pydantic-ai-backend>=0.2.16",
  "pydantic-ai-harness>=0.54",
  "pydantic-ai-slim[mcp,openai]>=2.54",
  "pypinyin>=0.55.0",
  "pyspellchecker>=0.9.0",
  "python-magic>=0.4.27",
  "send2trash>=2.1.0",
]

[project.optional-dependencies]
rag = [
  "chromadb>=1.5.6",
  "openai>=3.0.0",
  "sentence-transformers>=5.3.0",
]

[dependency-groups]
dev = [
  "check-requirements-txt>=1.4.2",
  "pytest>=9.1.1",
  "ruff>=0.16.2",
]

[tool.nonebot]
plugin_dirs = ["kanade_bot/plugins"]
builtin_plugins = ["echo"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
  { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
nonebot-adapter-console = [
  { name = "Console", module_name = "nonebot.adapters.console" },
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]
nonebot-plugin-htmlrender = ["nonebot_plugin_htmlrender"]
nonebot-plugin-localstore = ["nonebot_plugin_localstore"]
nonebot-plugin-whateat-pic = ["nonebot_plugin_whateat_pic"]
nonebot-plugin-wordcloud = ["nonebot_plugin_wordcloud"]
nonebot-plugin-picstatus = ["nonebot_plugin_picstatus"]
nonebot-plugin-githubcard = ["nonebot_plugin_githubcard"]

[tool.ruff.lint]
ignore = ["B008", "RUF012", "BLE001"]
